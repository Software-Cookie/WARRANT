apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma
  namespace: warrant-models
  labels: { app: gemma }
spec:
  replicas: 2
  selector:
    matchLabels: { app: gemma }
  template:
    metadata:
      labels: { app: gemma }
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.9.2
          args:
            - --model=google/gemma-3-4b-it
            - --served-model-name=gemma-3-4b-it
            - --max-model-len=8192
            - --gpu-memory-utilization=0.90
            - --port=8000
            - --disable-log-requests
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef: { name: hf-token, key: token }
            - name: HF_HOME
              value: /cache
          ports:
            - containerPort: 8000
          resources:
            requests: { cpu: "4", memory: 16Gi, nvidia.com/gpu: "1" }
            limits: { cpu: "4", memory: 16Gi, nvidia.com/gpu: "1" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 60
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: cache, mountPath: /cache }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: cache
          emptyDir: { sizeLimit: 40Gi }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: gemma
  namespace: warrant-models
  annotations:
    networking.gke.io/load-balancer-type: Internal
spec:
  type: LoadBalancer
  selector: { app: gemma }
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gemma
  namespace: warrant-models
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: gemma }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gemma-vpc-only
  namespace: warrant-models
spec:
  podSelector:
    matchLabels: { app: gemma }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.0.0.0/8 }
      ports:
        - { port: 8000, protocol: TCP }
  egress:
    - {}
