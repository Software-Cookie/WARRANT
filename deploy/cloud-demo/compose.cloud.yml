# Overlay for running the demo on one Google Compute Engine VM (used by scripts/cloud-demo-up.sh):
#   * Caddy terminates HTTPS and publishes only the console;
#   * demo sign-in on the console needs the access code from .local/cloud.env (empty = open demo);
#   * every service restarts automatically when the VM restarts.
services:
  postgres: { restart: unless-stopped }
  redis: { restart: unless-stopped }
  classifier: { restart: unless-stopped }
  acme-erp: { restart: unless-stopped }
  control-plane:
    restart: unless-stopped
    environment:
      WARRANT_CONSOLE_URL: ${WARRANT_PUBLIC_URL}
  pep-gateway: { restart: unless-stopped }
  console:
    restart: unless-stopped
    environment:
      WARRANT_CONSOLE_URL: ${WARRANT_PUBLIC_URL}
      WARRANT_DEMO_ACCESS_CODE: ${WARRANT_DEMO_ACCESS_CODE:-}
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    environment:
      WARRANT_SITE: ${WARRANT_SITE}
      WARRANT_DOMAIN: ${WARRANT_DOMAIN}
    ports:
      - "${WARRANT_HTTP_PORT:-80}:80"
      - "${WARRANT_HTTPS_PORT:-443}:443"
    volumes:
      - ./cloud-demo/Caddyfile:/etc/caddy/Caddyfile:ro  # relative to deploy/ (the first compose file)
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      console: { condition: service_healthy }
    networks: [backend]

volumes:
  caddy-data: {}
  caddy-config: {}
